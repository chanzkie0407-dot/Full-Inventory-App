<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Inventory POS Style</title>
    <style>
        :root {
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --secondary: #facc15;
            --secondary-dark: #eab308;
            --accent: #60a5fa;
            --accent-light: #93c5fd;
            --light: #f0f9ff;
            --card: #ffffff;
            --border: #cbd5e1;
            --text: #1e293b;
            --text-light: #64748b;
            --danger: #ef4444;
            --hover: #e0f2fe;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--light), #e0f2fe);
            min-height: 100vh;
            padding: 16px;
            color: var(--text);
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .top-bar {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .top-bar h1 {
            font-size: 1.4rem;
            color: var(--primary);
        }

        .meta-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .meta-item label {
            font-size: 0.85rem;
            color: var(--text-light);
            display: block;
            margin-bottom: 4px;
        }

        .meta-item input {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.9rem;
            background: transparent;
            color: var(--text);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 16px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .panel h2 {
            font-size: 1rem;
            color: var(--primary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent-light);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .cat-btn {
            background: var(--accent-light);
            border: none;
            border-radius: 8px;
            padding: 10px 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .cat-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(34, 197, 94, 0.3);
        }

        .cat-btn:hover {
            transform: translateY(-2px);
        }

        .search-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .item-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item-card:hover {
            border-color: var(--primary);
            background: var(--hover);
            transform: translateY(-2px);
        }

        .item-card.selected {
            border-color: var(--primary);
            background: #dcfce7;
        }

        .item-name {
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.3;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 12px;
        }

        .input-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-yellow {
            background: var(--secondary);
            color: #854d0e;
        }

        .btn-blue {
            background: var(--accent);
            color: #ffffff;
        }

        .btn-red {
            background: var(--danger);
            color: #ffffff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .added-list {
            max-height: 380px;
            overflow-y: auto;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-light);
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 6px;
            background: var(--light);
            margin-bottom: 6px;
        }

        .list-item .item-info {
            flex: 1;
            font-size: 0.9rem;
        }

        .list-item .qty {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .list-item input {
            width: 60px;
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            text-align: center;
            font-size: 0.9rem;
        }

        .list-item .del-btn {
            background: var(--danger);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--secondary), var(--secondary-dark));
            color: #854d0e;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 12px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-section {
            display: none;
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            margin-top: 20px;
            box-shadow: var(--shadow);
        }

        .results-section.show {
            display: block;
        }

        .results-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent);
        }

        .results-header h2 {
            color: var(--primary);
        }

        .results-meta {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .results-category {
            margin-bottom: 16px;
        }

        .results-category h3 {
            color: var(--accent);
            font-size: 1rem;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .results-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-light);
            font-style: italic;
        }

        @media print {
            body {
                background: #ffffff;
            }
            .top-bar, .main-grid, .button-row, .notification {
                display: none !important;
            }
            .results-section {
                display: block !important;
                box-shadow: none;
            }
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>

    <div class="app-container">
        <div class="top-bar">
            <h1>🍔 Burger Inventory Count</h1>
            <div class="meta-row">
                <div class="meta-item">
                    <label>Date & Time:</label>
                    <input type="text" id="reportDate" readonly>
                </div>
                <div class="meta-item">
                    <label>Prepared By:</label>
                    <input type="text" id="preparedBy" placeholder="Enter your name...">
                </div>
            </div>
        </div>

        <div class="main-grid">
            <!-- Left Sidebar: Added Items -->
            <div class="sidebar">
                <div class="panel">
                    <h2>📋 Added Items</h2>
                    <div class="list-header">
                        <span>Item</span>
                        <span>Qty</span>
                    </div>
                    <div class="added-list" id="addedList">
                        <p class="empty-state">No items added yet.</p>
                    </div>
                    <div class="total-row">
                        <span>Total Items Counted</span>
                        <span id="grandTotal">0</span>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Categories & Items -->
            <div class="panel">
                <h2>🛒 Select Items</h2>

                <!-- Category Buttons -->
                <div class="category-grid" id="categoryTabs"></div>

                <!-- Search -->
                <input type="text" class="search-input" id="itemSearch" placeholder="🔍 Search items...">

                <!-- Items Grid -->
                <div class="items-grid" id="itemsGrid">
                    <p class="empty-state">Select a category to view items.</p>
                </div>

                <!-- Quantity Input & Add Button -->
                <div class="input-row">
                    <input type="number" id="countInput" placeholder="Quantity" min="1" value="1">
                    <button class="btn btn-primary" id="addBtn">➕ Add</button>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="button-row">
            <button class="btn btn-blue" id="submitBtn">✅ Submit Report</button>
            <button class="btn btn-outline" id="printBtn">🖨️ Print Report</button>
            <button class="btn btn-outline" id="saveTxtBtn">📄 Save as TXT</button>
            <button class="btn btn-yellow" id="clearBtn">🗑️ Clear All</button>
        </div>

        <!-- Results / Report Section -->
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>📊 INVENTORY REPORT</h2>
            </div>
            <div class="results-meta">
                <div><strong>Date & Time:</strong> <span id="resDate"></span></div>
                <div><strong>Prepared By:</strong> <span id="resPreparedBy"></span></div>
            </div>
            <div id="resultsContent"></div>
            <div class="total-row" style="margin-top: 20px;">
                <span>Total Items Counted</span>
                <span id="resGrandTotal">0</span>
            </div>
        </div>
    </div>

    <script>
        // Complete Items Data
        const itemsData = {
            BUNS: ['Value', 'Double', 'Brioche', 'Hotdog'],
            PATTIES: ['Value', 'Chicken', 'Premium', 'Steak', 'Crispy Chicken', 'Veggie', 'Cheesydog', 'Franks', 'Hungarian', 'Bacon Strips'],
            DRINKS: ['Black Lemon Tea', 'Fruitwist', 'Iced Choco', 'Choco Mallows', 'Iced Coffee', 'Hot Coffee', 'Mineral Water'],
            SIDES_EXTRAS: ['Cheese', 'Egg', 'Farmer', 'Fries', 'Nuggets'],
            SAUCE_DRESSING: ['Caramelized Onion', 'Mushroom', 'Black Pepper Sauce', 'Bacon Cheese Sauce', 'Premium Coleslaw', 'Steak Dressing', 'Steak Roasted', 'Steak Tomato Ketchup', 'Cheddar Cheese', 'Beef Shawarma Dressing', 'Shawarma Cheese Sauce', 'French Onion', 'Hungarian Mayo', 'Hungarian Ketchup', 'Roasted Sesame Dressing', 'Roasted Cabbage', 'Chimi Mayo', 'Chimi Sauce', 'Pickled Onion', 'Sisig Sauce', 'Chicken Chicharon', 'Cheesy Sauce', 'Chicken Dressing Single', 'Chicken Dressing Double', 'MB Dressing'],
            OTHERS: ['Fries', 'Powder', 'BBQ Powder', 'Cheese Powder', 'Salted', 'Hot Sauce', 'Catsup'],
            CUPS: ['16oz', '8oz'],
            LIDS: ['16oz', '8oz'],
            PAPER_BAG: ['Small', 'Medium', 'Large']
        };

        const categoryLabels = {
            BUNS: '🍔 BUNS',
            : '🥩 PATTIES',
    DRINKS: '🥤 DRINKS',
    SIDES_EXTRAS: '🍟 SIDES & EXTRAS',
    SAUCE_DRESSING: '🥫 SAUCE / DRESSING',
    OTHERS: '📦 OTHERS',
    CUPS: '🥤 CUPS',
    LIDS: '🧢 LIDS',
    PAPER_BAG: '🛍️ PAPER BAG'
};

let inventoryData = {};
let activeCategory = 'BUNS';
let selectedItem = null;

document.addEventListener('DOMContentLoaded', () => {
    setCurrentDate();
    loadFromLocalStorage();
    buildCategoryButtons();
    renderItems();
    renderAddedList();
    setupEventListeners();
});

function setCurrentDate() {
    const now = new Date();
    document.getElementById('reportDate').value = now.toLocaleString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
}

function loadFromLocalStorage() {
    const saved = localStorage.getItem('inventoryData');
    const savedName = localStorage.getItem('preparedBy');
    if (saved) inventoryData = JSON.parse(saved);
    if (savedName) document.getElementById('preparedBy').value = savedName;
}

function saveToLocalStorage() {
    localStorage.setItem('inventoryData', JSON.stringify(inventoryData));
    localStorage.setItem('preparedBy', document.getElementById('preparedBy').value);
}

function showNotification(message) {
    const notif = document.getElementById('notification');
    notif.textContent = message;
    notif.style.display = 'block';
    setTimeout(() => {
        notif.style.display = 'none';
    }, 2500);
}

function buildCategoryButtons() {
    const container = document.getElementById('categoryTabs');
    container.innerHTML = '';
    
    Object.keys(itemsData).forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (cat === activeCategory ? ' active' : '');
        btn.textContent = categoryLabels[cat];
        btn.dataset.category = cat;
        btn.addEventListener('click', () => switchCategory(cat));
        container.appendChild(btn);
    });
}

function switchCategory(category) {
    activeCategory = category;
    selectedItem = null;
    buildCategoryButtons();
    document.getElementById('itemSearch').value = '';
    renderItems();
}

function renderItems(searchTerm = '') {
    const container = document.getElementById('itemsGrid');
    container.innerHTML = '';

    let itemsToShow = itemsData[activeCategory] || [];
    
    if (searchTerm) {
        const term = searchTerm.toLowerCase();
        itemsToShow = [];
        Object.keys(itemsData).forEach(cat => {
            itemsData[cat].filter(item => item.toLowerCase().includes(term)).forEach(item => {
                itemsToShow.push(item);
            });
        });
    }

    if (itemsToShow.length === 0) {
        container.innerHTML = '<p class="empty-state">No items found.</p>';
        return;
    }

    itemsToShow.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card' + (selectedItem === item ? ' selected' : '');
        card.innerHTML = `<span class="item-name">${item}</span>`;
        card.addEventListener('click', () => selectItem(item));
        container.appendChild(card);
    });
}

function selectItem(item) {
    selectedItem = item;
    renderItems(document.getElementById('itemSearch').value);
    showNotification(`Selected: ${item}`);
}

function setupEventListeners() {
    document.getElementById('itemSearch').addEventListener('input', (e) => {
        renderItems(e.target.value.trim());
    });

    document.getElementById('addBtn').addEventListener('click', addItem);

    document.getElementById('countInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addItem();
    });

    document.getElementById('submitBtn').addEventListener('click', generateReport);

    document.getElementById('printBtn').addEventListener('click', () => {
        if (!document.querySelector('.results-section.show')) {
            alert('Please submit the report first.');
            return;
        }
        window.print();
    });

    document.getElementById('saveTxtBtn').addEventListener('click', saveAsTxt);

    document.getElementById('clearBtn').addEventListener('click', () => {
        if (confirm('Clear ALL added items? This cannot be undone.')) {
            inventoryData = {};
            saveToLocalStorage();
            renderAddedList();
            document.getElementById('resultsSection').classList.remove('show');
            showNotification('All items cleared.');
        }
    });
}

function addItem() {
    if (!selectedItem) {
        alert('Please select an item first.');
        return;
    }

    const qty = parseInt(document.getElementById('countInput').value) || 0;
    if (qty < 1) {
        alert('Please enter a valid quantity (minimum 1).');
        return;
    }

    if (!inventoryData[activeCategory]) {
        inventoryData[activeCategory] = {};
    }

    const previous = inventoryData[activeCategory][selectedItem] || 0;
    inventoryData[activeCategory][selectedItem] = previous + qty;

    saveToLocalStorage();
    renderAddedList();
    showNotification(`✅ ${selectedItem}: +${qty} → Total: ${inventoryData[activeCategory][selectedItem]}`);

    document.getElementById('countInput').value = 1;
    selectedItem = null;
    renderItems(document.getElementById('itemSearch').value);
}

function renderAddedList() {
    const container = document.getElementById('addedList');
    const cats = Object.keys(inventoryData);
    let grandTotal = 0;

    if (cats.length === 0) {
        container.innerHTML = '<p class="empty-state">No items added yet.</p>';
        document.getElementById('grandTotal').textContent = '0';
        return;
    }

    let html = '';
    cats.forEach(cat => {
        Object.keys(inventoryData[cat]).forEach(item => {
            const qty = inventoryData[cat][item];
            grandTotal += qty;
            html += `
                <div class="list-item">
                    <div class="item-info">${item}</div>
                    <div class="qty">
                        <input type="number" value="${qty}" min="1" 
                            data-cat="${cat}" data-item="${item}"
                            onchange="updateQuantity(this)">
                        <button class="del-btn" data-cat="${cat}" data-item="${item}"
                            onclick="removeItem(this)">✕</button>
                    </div>
                </div>
            `;
        });
    });

    container.innerHTML = html;
    document.getElementById('grandTotal').textContent = grandTotal;
}

function updateQuantity(input) {
    const cat = input.getAttribute('data-cat');
    const item = input.getAttribute('data-item');
    const newQty = parseInt(input.value) || 1;
    
    if (newQty < 1) {
        input.value = 1;
        return;
    }

    inventoryData[cat][item] = newQty;
    saveToLocalStorage();
    recalculateTotal();
    showNotification(`🔄 ${item} quantity updated to ${newQty}`);
}

function removeItem(btn) {
    const cat = btn.getAttribute('data-cat');
    const item = btn.getAttribute('data-item');
    
    if (confirm(`Remove "${item}" from list?`)) {
        delete inventoryData[cat][item];
        if (Object.keys(inventoryData[cat]).length === 0) {
            delete inventoryData[cat];
        }
        saveToLocalStorage();
        renderAddedList();
        showNotification(`🗑️ Removed: ${item}`);
    }
}

function recalculateTotal() {
    let total = 0;
    Object.keys(inventoryData).forEach(cat => {
        Object.values(inventoryData[cat]).forEach(qty => {
            total += qty;
        });
    });
    document.getElementById('grandTotal').textContent = total;
}

function generateReport() {
    const reportDate = document.getElementById('reportDate').value;
    const preparedBy = document.getElementById('preparedBy').value || 'Not Provided';
    const cats = Object.keys(inventoryData);
    
    if (cats.length === 0) {
        alert('No items counted yet. Please add items first.');
        return;
    }

    document.getElementById('resDate').textContent = reportDate;
    document.getElementById('resPreparedBy').textContent = preparedBy;

    let html = '';
    let grandTotal = 0;

    cats.forEach(cat => {
        const items = Object.keys(inventoryData[cat]);
        html += `
            <div class="results-category">
                <h3>${categoryLabels[cat] || cat}</h3>
        `;
        items.forEach(item => {
            const qty = inventoryData[cat][item];
            grandTotal += qty;
            html += `
                <div class="results-item">
                    <span>${item}</span>
                    <span>${qty}</span>
                </div>
            `;
        });
        html += `</div>`;
    });

    document.getElementById('resultsContent').innerHTML = html;
    document.getElementById('resGrandTotal').textContent = grandTotal;
    document.getElementById('resultsSection').classList.add('show');
    
    document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
    showNotification('✅ Report generated successfully!');
}

function saveAsTxt() {
    const reportDate = document.getElementById('reportDate').value;
    const preparedBy = document.getElementById('preparedBy').value || 'Not Provided';
    const cats = Object.keys(inventoryData);
    
    if (cats.length === 0) {
        alert('No items counted yet. Please add items first.');
        return;
    }

    let text = '========================================\n';
    text += '         BURGER INVENTORY REPORT\n';
    text += '========================================\n\n';
    text += `Date & Time: ${reportDate}\n`;
    text += `Prepared By: ${preparedBy}\n\n`;
    text += '----------------------------------------\n\n';

    let grandTotal = 0;
    cats.forEach(cat => {
        text += `${categoryLabels[cat] || cat}:\n`;
        Object.keys(inventoryData[cat]).forEach(item => {
            const qty = inventoryData[cat][item];
            grandTotal += qty;
            text += `  ${item}: ${qty}\n`;
        });
        text += '\n';
    });

    text += '----------------------------------------\n';
    text += `TOTAL ITEMS COUNTED: ${grandTotal}\n`;
    text += '========================================\n';

    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Inventory_Report_${new Date().toISOString().slice(0,10)}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    showNotification('📄 Report saved as text file!');
}
    </script>
</body>
</html>
